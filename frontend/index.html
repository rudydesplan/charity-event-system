<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Join the Charity Fun Run and register to support local community projects."
    />
    <meta name="theme-color" content="#173f38" />
    <title>GoodRun — Charity Fun Run</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/" aria-label="GoodRun home">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span class="brand-copy">
            <strong>GoodRun</strong>
            <small>Move for community</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#/" data-nav="home">Event</a>
          <a href="#/participants" data-nav="participants">Participants</a>
          <a class="nav-cta" href="#/register" data-nav="register">
            Register
            <span aria-hidden="true">→</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="brand brand-footer" href="#/">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span class="brand-copy">
            <strong>GoodRun</strong>
            <small>Move for community</small>
          </span>
        </a>
        <p>Small steps. Shared purpose. Lasting local impact.</p>
        <p class="footer-meta">Charity Fun Run · 2026</p>
      </div>
    </footer>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
